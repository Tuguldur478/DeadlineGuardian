server.port=8080
spring.application.name=deadline-guardian

# Anthropic API key is read from environment variable ANTHROPIC_API_KEY.
# If unset, the backend falls back to deterministic mock data so the app still demos.
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.model=claude-sonnet-4-6
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.api.version=2023-06-01
